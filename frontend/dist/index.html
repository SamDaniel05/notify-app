<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notify</title>
  <meta name="theme-color" content="#0b1220" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0b1220;--panel:#121a2b;--panel2:#182338;--line:#243149;--text:#e8eef8;--muted:#8fa0b8;--accent:#3d8bfd;--ok:#34d399;--danger:#f87171;--serif:"IBM Plex Serif",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;font-family:var(--sans);background:radial-gradient(1200px 600px at 10% -10%,#152238,var(--bg));color:var(--text);line-height:1.5;min-height:100vh}
    .shell{max-width:960px;margin:0 auto;padding:24px 16px 64px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
    .brand{font-family:var(--serif);font-size:1.5rem;font-weight:600}.brand small{color:var(--muted);font-family:var(--sans);font-size:.8rem;margin-left:8px;font-weight:500}
    .card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
    h1,h2{font-family:var(--serif);margin:0 0 8px;letter-spacing:-.02em}
    .muted{color:var(--muted)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
    input,select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 12px;font:inherit;margin-bottom:12px}
    button{min-height:44px;border:0;border-radius:999px;padding:0 16px;font:500 .9rem var(--sans);cursor:pointer;background:var(--accent);color:#04101f}
    button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
    .error{color:var(--danger)}.ok{color:var(--ok)}
    .grid{display:grid;gap:16px}@media(min-width:800px){.grid{grid-template-columns:1fr 1fr}}
    .badge{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#7dd3fc;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
    .hidden{display:none}.tabs button.active{border-color:var(--line);background:var(--panel2);color:var(--text)}
    .tabs button{background:transparent;color:var(--muted);border:1px solid transparent}
    pre{white-space:pre-wrap;font-size:12px;color:var(--muted)}
    a.link,.link{color:#7dd3fc;cursor:pointer;font-size:.875rem}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">Notify <small data-i18n="tagline">Watch what matters. Get notified.</small></div>
      <div class="row">
        <select id="lang" style="width:auto;margin:0" aria-label="Language">
          <option value="en">English</option>
          <option value="ta">தமிழ்</option>
        </select>
        <button type="button" class="ghost hidden" id="logout" data-i18n="signout">Sign out</button>
      </div>
    </header>
    <p class="muted" id="apiHint"></p>

    <section id="authView" class="card" style="max-width:460px">
      <h1 id="authTitle">Sign in</h1>
      <p class="muted" id="authSub" data-i18n="auth_sub">Public accounts · private alerts · English &amp; Tamil</p>
      <div class="row tabs" style="margin:16px 0" id="authTabs">
        <button type="button" class="active" data-mode="login" data-i18n="tab_signin">Sign in</button>
        <button type="button" data-mode="register" data-i18n="tab_create">Create account</button>
        <button type="button" data-mode="magic" data-i18n="tab_magic">Magic link</button>
        <button type="button" data-mode="forgot" data-i18n="tab_forgot">Forgot password</button>
      </div>
      <form id="authForm">
        <label for="email" data-i18n="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
        <div id="nameWrap" class="hidden"><label for="displayName" data-i18n="display_name">Display name</label><input id="displayName" /></div>
        <div id="passWrap"><label for="password" data-i18n="password">Password</label><input id="password" type="password" autocomplete="current-password" /></div>
        <div id="codeWrap" class="hidden"><label for="code" data-i18n="code">6-digit code</label><input id="code" inputmode="numeric" maxlength="8" placeholder="123456" /></div>
        <div id="newPassWrap" class="hidden"><label for="newPassword" data-i18n="new_password">New password</label><input id="newPassword" type="password" autocomplete="new-password" /></div>
        <div id="tokenWrap" class="hidden"><label for="token" data-i18n="magic_token">Magic token</label><input id="token" /></div>
        <p class="error" id="authErr"></p>
        <p class="ok" id="authOk"></p>
        <button type="submit" id="authSubmit" data-i18n="continue">Continue</button>
        <p style="margin-top:12px"><span class="link" id="resendLink" style="display:none" data-i18n="resend">Resend code</span></p>
      </form>
    </section>

    <section id="appView" class="hidden">
      <div class="grid">
        <div class="card">
          <h2 data-i18n="my_alerts">My alerts</h2>
          <p class="muted" id="userLine"></p>
          <div id="rules"></div>
        </div>
        <div class="card">
          <h2 data-i18n="add_alert">Add alert</h2>
          <form id="alertForm">
            <label for="aTitle" data-i18n="title">Title</label><input id="aTitle" data-i18n-placeholder="optional" placeholder="Optional" />
            <label for="aType" data-i18n="type">Type</label>
            <select id="aType">
              <option value="weather" data-i18n="type_weather">Place weather / rain</option>
              <option value="keyword" data-i18n="type_keyword">Keyword / news</option>
              <option value="rss" data-i18n="type_rss">RSS or page</option>
            </select>
            <div id="pWeather"><label for="aPlace" data-i18n="place">Place name</label><input id="aPlace" placeholder="Tambaram…" /></div>
            <div id="pKeyword" class="hidden"><label for="aQuery" data-i18n="keywords">Keywords</label><input id="aQuery" /></div>
            <div id="pRss" class="hidden"><label for="aFeed" data-i18n="feed">Feed URL</label><input id="aFeed" /></div>
            <button type="submit" data-i18n="save">Save</button>
          </form>
        </div>
      </div>
      <div class="grid" style="margin-top:16px">
        <div class="card">
          <h2 data-i18n="delivery">Delivery</h2>
          <div id="channels"></div>
          <button type="button" id="testPush" style="margin-top:12px" data-i18n="test_push">Send test notification</button>
          <p class="error" id="delErr"></p><p class="ok" id="delOk"></p>
        </div>
        <div class="card">
          <form id="ntfyForm"><h2>ntfy</h2><label for="ntfyTopic" data-i18n="topic">Topic</label><input id="ntfyTopic" required /><button type="submit" data-i18n="save_ntfy">Save ntfy</button></form>
          <hr style="border-color:var(--line);margin:16px 0" />
          <form id="tgForm"><h2>Telegram</h2><label for="tgChat" data-i18n="chat_id">Chat ID</label><input id="tgChat" required /><button type="submit" data-i18n="save_tg">Save Telegram</button></form>
        </div>
      </div>
    </section>
  </div>
  <script>
    const I18N = {
      en: {
        tagline: 'Watch what matters. Get notified.',
        signout: 'Sign out',
        auth_sub: 'Public accounts · private alerts · English & Tamil',
        tab_signin: 'Sign in', tab_create: 'Create account', tab_magic: 'Magic link', tab_forgot: 'Forgot password',
        email: 'Email', display_name: 'Display name', password: 'Password', code: '6-digit code',
        new_password: 'New password', magic_token: 'Magic token', continue: 'Continue', resend: 'Resend code',
        my_alerts: 'My alerts', add_alert: 'Add alert', title: 'Title', optional: 'Optional', type: 'Type',
        type_weather: 'Place weather / rain', type_keyword: 'Keyword / news', type_rss: 'RSS or page',
        place: 'Place name', keywords: 'Keywords', feed: 'Feed URL', save: 'Save',
        delivery: 'Delivery', test_push: 'Send test notification', topic: 'Topic', save_ntfy: 'Save ntfy',
        chat_id: 'Chat ID', save_tg: 'Save Telegram',
        title_login: 'Sign in', title_register: 'Create account', title_verify: 'Verify email',
        title_forgot: 'Forgot password', title_reset: 'Reset password', title_magic: 'Magic link',
        title_magicVerify: 'Enter magic token',
        btn_register: 'Create account', btn_verify: 'Verify', btn_reset: 'Set new password', btn_continue: 'Continue',
        private: 'private', no_alerts: 'No alerts yet.', no_channels: 'No channels yet.',
        api_missing: 'API not connected. Open with ?api=https://notify-app-letm.onrender.com'
      },
      ta: {
        tagline: 'முக்கியமானதை கவனிக்கவும். அறிவிப்பு பெறுங்கள்.',
        signout: 'வெளியேறு',
        auth_sub: 'பொது கணக்குகள் · தனிப்பட்ட அறிவிப்புகள் · ஆங்கிலம் & தமிழ்',
        tab_signin: 'உள்நுழை', tab_create: 'கணக்கு உருவாக்கு', tab_magic: 'மேஜிக் இணைப்பு', tab_forgot: 'கடவுச்சொல் மறந்துவிட்டதா',
        email: 'மின்னஞ்சல்', display_name: 'காட்சி பெயர்', password: 'கடவுச்சொல்', code: '6 இலக்க குறியீடு',
        new_password: 'புதிய கடவுச்சொல்', magic_token: 'மேஜிக் டோக்கன்', continue: 'தொடரவும்', resend: 'குறியீட்டை மீண்டும் அனுப்பு',
        my_alerts: 'என் அறிவிப்புகள்', add_alert: 'அறிவிப்பு சேர்', title: 'தலைப்பு', optional: 'விருப்பம்', type: 'வகை',
        type_weather: 'இட வானிலை / மழை', type_keyword: 'முக்கிய சொல் / செய்தி', type_rss: 'RSS அல்லது பக்கம்',
        place: 'இடத்தின் பெயர்', keywords: 'முக்கிய சொற்கள்', feed: 'Feed URL', save: 'சேமி',
        delivery: 'விநியோகம்', test_push: 'சோதனை அறிவிப்பு அனுப்பு', topic: 'தலைப்பு', save_ntfy: 'ntfy சேமி',
        chat_id: 'Chat ID', save_tg: 'Telegram சேமி',
        title_login: 'உள்நுழை', title_register: 'கணக்கு உருவாக்கு', title_verify: 'மின்னஞ்சல் சரிபார்',
        title_forgot: 'கடவுச்சொல் மறந்துவிட்டதா', title_reset: 'கடவுச்சொல் மீட்டமை', title_magic: 'மேஜிக் இணைப்பு',
        title_magicVerify: 'மேஜிக் டோக்கன் உள்ளிடவும்',
        btn_register: 'கணக்கு உருவாக்கு', btn_verify: 'சரிபார்', btn_reset: 'புதிய கடவுச்சொல் அமை', btn_continue: 'தொடரவும்',
        private: 'தனிப்பட்ட', no_alerts: 'இன்னும் அறிவிப்புகள் இல்லை.', no_channels: 'சேனல்கள் இல்லை.',
        api_missing: 'API இணைக்கப்படவில்லை. ?api= உடன் திறக்கவும்'
      }
    };

    const API = localStorage.getItem('notify_api') || '';
    let mode = 'login';
    let lang = localStorage.getItem('notify_lang') || 'en';
    const $ = (id) => document.getElementById(id);
    const t = (key) => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;

    function applyI18n(){
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n');
        if (I18N[lang] && I18N[lang][key] != null) el.textContent = I18N[lang][key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
        const key = el.getAttribute('data-i18n-placeholder');
        if (I18N[lang] && I18N[lang][key] != null) el.placeholder = I18N[lang][key];
      });
      $('lang').value = lang;
      setMode(mode);
    }

    function setSession(data){
      if(data.access) localStorage.setItem('notify_access', data.access);
      if(data.refresh) localStorage.setItem('notify_refresh', data.refresh);
      if(data.user) localStorage.setItem('notify_user', JSON.stringify(data.user));
      render();
    }
    async function api(path, opts={}){
      const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
      const a = localStorage.getItem('notify_access');
      if(a) headers.Authorization = 'Bearer '+a;
      const res = await fetch(API+path, { ...opts, headers });
      const text = await res.text();
      let data=null; try{ data=text?JSON.parse(text):null;}catch{ data={detail:text}; }
      if(!res.ok){
        const err = new Error((typeof data?.detail === 'string' ? data.detail : null) || 'Request failed');
        err.status = res.status; err.data = data; throw err;
      }
      return data;
    }
    function setMode(m){
      mode = m;
      document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
      $('nameWrap').classList.toggle('hidden', m!=='register');
      $('passWrap').classList.toggle('hidden', !['login','register'].includes(m));
      $('codeWrap').classList.toggle('hidden', !['verify','reset'].includes(m));
      $('newPassWrap').classList.toggle('hidden', m!=='reset');
      $('tokenWrap').classList.toggle('hidden', m!=='magicVerify');
      $('resendLink').style.display = m==='verify' ? 'inline' : 'none';
      $('password').required = ['login','register'].includes(m);
      const titleKey = 'title_' + m;
      $('authTitle').textContent = t(titleKey);
      if(m==='register') $('authSubmit').textContent = t('btn_register');
      else if(m==='verify') $('authSubmit').textContent = t('btn_verify');
      else if(m==='reset') $('authSubmit').textContent = t('btn_reset');
      else $('authSubmit').textContent = t('btn_continue');
    }
    function render(){
      const user = JSON.parse(localStorage.getItem('notify_user')||'null');
      $('authView').classList.toggle('hidden', !!user);
      $('appView').classList.toggle('hidden', !user);
      $('logout').classList.toggle('hidden', !user);
      if(user){
        $('userLine').textContent = (user.profile?.display_name || user.email || user.username)+' · '+t('private');
        loadRules(); loadChannels();
      }
    }
    async function checkApi(){
      try{ await api('/api/health/'); $('apiHint').textContent=''; return true; }
      catch{ $('apiHint').textContent=t('api_missing'); return false; }
    }

    $('lang').onchange = () => {
      lang = $('lang').value;
      localStorage.setItem('notify_lang', lang);
      applyI18n();
      render();
    };

    document.querySelectorAll('[data-mode]').forEach(btn=>{
      btn.onclick=()=>{ setMode(btn.dataset.mode); $('authErr').textContent=''; $('authOk').textContent=''; };
    });

    $('authForm').onsubmit=async(e)=>{
      e.preventDefault(); $('authErr').textContent=''; $('authOk').textContent='';
      const email=$('email').value.trim().toLowerCase();
      try{
        if(mode==='register'){
          const res = await api('/api/auth/register/',{method:'POST',body:JSON.stringify({email,password:$('password').value,display_name:$('displayName').value,preferred_language:lang})});
          $('authOk').textContent = res.detail + (res.dev_code ? ' Dev code: '+res.dev_code : '');
          setMode('verify');
          if(res.dev_code) $('code').value = res.dev_code;
        } else if(mode==='login'){
          try{
            const data = await api('/api/auth/login/',{method:'POST',body:JSON.stringify({email,password:$('password').value})});
            setSession(data);
          } catch(err){
            if(err.data?.requires_verification){
              $('authOk').textContent = err.data.detail;
              setMode('verify');
            } else throw err;
          }
        } else if(mode==='verify'){
          const data = await api('/api/auth/verify-email/',{method:'POST',body:JSON.stringify({email,code:$('code').value.trim()})});
          setSession(data);
        } else if(mode==='forgot'){
          const res = await api('/api/auth/password-reset/',{method:'POST',body:JSON.stringify({email})});
          $('authOk').textContent = res.detail + (res.dev_code ? ' Dev code: '+res.dev_code : '');
          setMode('reset');
          if(res.dev_code) $('code').value = res.dev_code;
        } else if(mode==='reset'){
          const data = await api('/api/auth/password-reset/confirm/',{method:'POST',body:JSON.stringify({email,code:$('code').value.trim(),new_password:$('newPassword').value})});
          setSession(data);
        } else if(mode==='magic'){
          const res = await api('/api/auth/magic/',{method:'POST',body:JSON.stringify({email})});
          $('authOk').textContent = res.detail + (res.dev_token ? ' Token: '+res.dev_token : '');
          setMode('magicVerify');
          if(res.dev_token) $('token').value = res.dev_token;
        } else if(mode==='magicVerify'){
          const data = await api('/api/auth/magic/verify/',{method:'POST',body:JSON.stringify({email,token:$('token').value})});
          setSession(data);
        }
      }catch(err){ $('authErr').textContent = err.message; }
    };

    $('resendLink').onclick=async()=>{
      try{
        const res = await api('/api/auth/resend-code/',{method:'POST',body:JSON.stringify({email:$('email').value.trim().toLowerCase()})});
        $('authOk').textContent = res.detail + (res.dev_code ? ' Dev code: '+res.dev_code : '');
        if(res.dev_code) $('code').value = res.dev_code;
      }catch(err){ $('authErr').textContent = err.message; }
    };

    $('logout').onclick=()=>{['notify_access','notify_refresh','notify_user'].forEach(k=>localStorage.removeItem(k)); render();};
    $('aType').onchange=()=>{const v=$('aType').value; $('pWeather').classList.toggle('hidden',v!=='weather'); $('pKeyword').classList.toggle('hidden',v!=='keyword'); $('pRss').classList.toggle('hidden',v!=='rss');};

    async function loadRules(){ try{ const rules=await api('/api/alerts/'); $('rules').innerHTML=rules.length?rules.map(r=>`<div style="border-top:1px solid var(--line);padding:12px 0"><strong>${r.title}</strong> <span class="badge">${r.alert_type}</span><pre>${JSON.stringify(r.params)}</pre></div>`).join(''):'<p class="muted">'+t('no_alerts')+'</p>'; }catch(e){ $('rules').innerHTML='<p class="error">'+e.message+'</p>'; } }
    $('alertForm').onsubmit=async(e)=>{ e.preventDefault(); const type=$('aType').value; const params=type==='weather'?{place_name:$('aPlace').value}:type==='keyword'?{query:$('aQuery').value}:{feed_url:$('aFeed').value};
      try{ await api('/api/alerts/',{method:'POST',body:JSON.stringify({title:$('aTitle').value||params.place_name||params.query||params.feed_url||'Alert',alert_type:type,params})}); loadRules(); }catch(err){ alert(err.message);} };
    async function loadChannels(){ try{ const ch=await api('/api/delivery/'); $('channels').innerHTML=ch.length?'<ul>'+ch.map(c=>`<li><span class="badge">${c.channel_type}</span> ${JSON.stringify(c.config)}</li>`).join('')+'</ul>':'<p class="muted">'+t('no_channels')+'</p>'; }catch(e){ $('channels').innerHTML='<p class="error">'+e.message+'</p>'; } }
    $('ntfyForm').onsubmit=async(e)=>{ e.preventDefault(); try{ await api('/api/delivery/',{method:'POST',body:JSON.stringify({channel_type:'ntfy',config:{topic:$('ntfyTopic').value},label:'default'})}); $('delOk').textContent='ntfy saved'; loadChannels(); }catch(err){ $('delErr').textContent=err.message; } };
    $('tgForm').onsubmit=async(e)=>{ e.preventDefault(); try{ await api('/api/delivery/',{method:'POST',body:JSON.stringify({channel_type:'telegram',config:{chat_id:$('tgChat').value},label:'default'})}); $('delOk').textContent='Telegram saved'; loadChannels(); }catch(err){ $('delErr').textContent=err.message; } };
    $('testPush').onclick=async()=>{ try{ const r=await api('/api/delivery/test/',{method:'POST',body:'{}'}); $('delOk').textContent=r.detail; }catch(err){ $('delErr').textContent=err.message; } };

    const q=new URLSearchParams(location.search);
    if(q.get('api')){ localStorage.setItem('notify_api', q.get('api').replace(/\/$/,'')); location.href=location.pathname; }
    if(!localStorage.getItem('notify_api')) localStorage.setItem('notify_api','https://notify-app-letm.onrender.com');
    applyI18n();
    checkApi().then(render);
  </script>
</body>
</html>
